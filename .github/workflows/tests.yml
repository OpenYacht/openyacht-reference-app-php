name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install pnpm
        # composer setup installs JS deps with pnpm; the lockfile is pnpm's.
        # The version installed here is only the launcher — pnpm reads the
        # packageManager pin in package.json and runs exactly that version,
        # so the pin stays the single source of truth.
        run: npm install --global pnpm

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check

  # The identical suite against MySQL. SQLite is the zero-config default,
  # but production nodes run MySQL/MariaDB — engine divergences (typing,
  # JSON functions, collations) must fail here, not in production.
  tests-mysql:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: openyacht_reference_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install pnpm
        # composer setup installs JS deps with pnpm; the lockfile is pnpm's.
        # The version installed here is only the launcher — pnpm reads the
        # packageManager pin in package.json and runs exactly that version,
        # so the pin stays the single source of truth.
        run: npm install --global pnpm

      - name: Setup Application
        run: composer setup

      - name: Run tests against MySQL
        # Pest directly, not `artisan test`: Collision's TestCommand always
        # injects --configuration=phpunit.xml, so passing a second one makes
        # PHPUnit warn and exit non-zero even when every test passes.
        run: php vendor/bin/pest --compact --configuration=phpunit.mysql.xml
