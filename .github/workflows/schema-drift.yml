name: schema-drift

# The protocol is amended without a version bump while it is a draft, so
# protocol_versions never tells a node it has fallen behind. This compares
# the schemas vendored in resources/schemas/v1 with the ones currently
# published, and when they differ runs the conformance tests against the
# published copies — so the issue it opens names the concrete defects
# ("/features/0: The required properties (quantity) are missing"), not just
# a diff. It never blocks a merge: the suite validates against the vendored
# schemas and stays deterministic. To resolve an issue, copy the published
# schemas/v1 over resources/schemas/v1 and fix whatever then fails.

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  compare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout the published protocol
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenYacht/protocol
          path: .protocol
          persist-credentials: false

      - name: Compare vendored schemas with the published ones
        id: compare
        run: |
          if diff -ru resources/schemas/v1 .protocol/schemas/v1 > schema.diff; then
            echo "drifted=false" >> "$GITHUB_OUTPUT"
          else
            echo "drifted=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup PHP
        if: steps.compare.outputs.drifted == 'true'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        if: steps.compare.outputs.drifted == 'true'
        # No JS build: the conformance tests only exercise the federation
        # endpoints, which render JSON.
        run: |
          composer install --no-interaction --no-progress
          cp .env.example .env
          php artisan key:generate

      - name: Run the conformance tests against the published schemas
        if: steps.compare.outputs.drifted == 'true'
        env:
          OPENYACHT_SCHEMAS_PATH: ${{ github.workspace }}/.protocol/schemas/v1
        run: |
          php vendor/bin/pest --compact --colors=never tests/Feature/Federation/SchemaConformanceTest.php > conformance.txt 2>&1 \
            && echo "The node's output still conforms to the published schemas — refreshing the vendored copies is all that is needed." > verdict.txt \
            || echo "The node's output does NOT conform to the published schemas — see the test output below." > verdict.txt

      - name: Open or update the drift issue
        if: steps.compare.outputs.drifted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: The published OpenYacht schemas have moved ahead of this app
        run: |
          {
            echo "The schemas vendored in \`resources/schemas/v1\` no longer match [\`OpenYacht/protocol\`](https://github.com/OpenYacht/protocol/tree/main/schemas/v1)."
            echo
            cat verdict.txt
            echo
            echo "To resolve: copy the published \`schemas/v1\` over \`resources/schemas/v1\`, run the suite, and fix what fails. A change to what a listing serves on the wire also needs a migration stamping \`federation_updated_at\` for the affected listings."
            echo
            echo "### Conformance tests against the published schemas"
            echo
            echo '```'
            tail -n 120 conformance.txt
            echo '```'
            echo
            echo "### Diff (vendored → published)"
            echo
            echo '```diff'
            head -c 40000 schema.diff
            echo '```'
            echo
            echo "_Last checked by [this run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)._"
          } > issue.md

          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --body-file issue.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file issue.md
          fi

      - name: Fail the run so the drift is visible
        if: steps.compare.outputs.drifted == 'true'
        run: exit 1
