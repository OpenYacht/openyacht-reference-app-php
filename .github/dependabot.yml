version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - '*'

  # "Always latest stable everything" is a standing rule here: drift is
  # resolved upward, never worked around. Minor and patch bumps arrive
  # grouped so one PR carries the routine churn; majors come on their own
  # because they need reading.
  - package-ecosystem: 'composer'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 5
    groups:
      php-minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 5
    groups:
      js-minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
