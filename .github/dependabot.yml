version: 2

# Security updates only. `open-pull-requests-limit: 0` switches off routine
# version-update PRs; Dependabot security updates (enabled in the repository
# settings) are not affected by it and still open PRs for vulnerable
# dependencies. Routine drift is still resolved upward ("always latest
# stable everything"), by hand with `composer update` / `pnpm update`.
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 0

  - package-ecosystem: 'composer'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 0

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 0
