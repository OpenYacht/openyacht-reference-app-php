packages:
  - '.'

publicHoistPattern:
  - '@inertiajs/core'

# .npmrc sets ignore-scripts=true: no dependency runs install scripts here.
# pnpm 12 refuses to skip them silently, so the three that would run are
# declined explicitly. Each ships prebuilt platform binaries as optional
# dependencies (pinned for linux-x64 and win32-x64 in package.json) and its
# script only selects one — nothing is compiled, nothing is missing.
allowBuilds:
  esbuild: false
  unrs-resolver: false
  vue-demi: false
